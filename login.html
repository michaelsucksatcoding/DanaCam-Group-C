<!-- ================= LOGIN PAGE (login.html) ================= -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DanaCam</title>

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- custom css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- header section starts -->
    <header>

        <input type="checkbox" id="toggler">
        <label for="toggler" class="fa-solid fa-bars"></label>

        <a href="index.html" class="logo">DanaCam<span>.</span></a>

        <nav class="navbar">
            <a href="index.html#home">Beranda</a>
            <a href="index.html#about">Tentang Kami</a>
            <a href="index.html#services">Cara Kerja</a>
            <a href="index.html#review">Komentar</a>
            <a href="index.html#contact">Kontak</a>
        </nav>

        <div class="icon">
            <a href="login.html" class="fa-solid fa-user"></a>
        </div>

    </header>
    <!-- header section ends -->

    <!-- login section starts -->
    <section class="login" id="login">

        <h1 class="heading"><span> Login </span> Pengguna</h1>

        <div class="row">

            <form action="">
                <div class="login-icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h2>Masuk ke Akun Anda</h2>

                <input type="email" placeholder="Email" class="box" required>
                <input type="password" placeholder="Password" class="box" required>

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Ingat Saya</label>
                </div>

                <input type="submit" value="Login" class="btn">

                <p>Belum punya akun? <a href="#">Daftar Sekarang</a></p>
            </form>

        </div>

    </section>
    <!-- login section ends -->

    <!-- footer section starts -->
    <section class="footer">

        <div class="box-container">

            <div class="box">
                <h3>Info Kontak</h3>
                <a href="#">+62 821-6560-8280</a>
                <a href="#">DanaCam@gmail.com</a>
                <a href="#">Jl. Cendana, No. 123, Bengkulu</a>
            </div>

            <div class="credit">Created by <span>C Group</span> | All rights reserved</div>

        </div>

    </section>
    <!-- footer section ends -->

</body>

</html>
