<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DanaCam</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="contact" id="register">

        <h1 class="heading"><span>Register</span> Pengguna Baru</h1>

        <div class="row">

            <form id="registerForm" onsubmit="return false;">

                <h2>Buat Akun Baru</h2>

                <input type="text" id="nama" placeholder="Nama Lengkap" class="box" required>

                <input type="text" id="nik" placeholder="NIK / Nomor KTP (16 digit)" class="box" inputmode="numeric"
                    pattern="[0-9]{16}" maxlength="16" required>

                <input type="email" id="email" placeholder="Email" class="box" required>

                <input type="password" id="password" placeholder="Password" class="box" minlength="6" required>

                <h3 style="text-align: center; margin-top: 2rem;">Verifikasi Wajah</h3>

                <div class="verification-container"
                    style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem; margin-top: 1.5rem; width: 100%;">

                    <div class="video-wrapper"
                        style="border-radius: .5rem; overflow: hidden; box-shadow: 0 .2rem .8rem rgba(0,0,0,0.1); line-height: 0;">
                        <video id="video" width="320" height="240" autoplay playsinline
                            style="object-fit: cover;"></video>
                    </div>

                    <canvas id="canvas" style="display:none;"></canvas>

                    <button type="button" class="btn" onclick="validateAndVerify()"
                        style="width: 100%; max-width: 320px; margin-top: 0;">
                        Register & Verifikasi
                    </button>

                    <div style="text-align: center; font-size: 1rem;">
                        <p id="status" style="margin-bottom: 0.5rem; font-weight: bold;">Lengkapi data lalu lakukan
                            verifikasi.</p>
                        <p style="color: #444; padding-top: 0.5rem;">Sudah punya akun? <a href="login.html"
                                style="color: var(--blue); font-weight: bold;">Login</a></p>
                    </div>

                </div>
            </form>

        </div>

    </section>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const statusText = document.getElementById("status");

        let stream = null;

        // Fungsi pembantu untuk memperbarui teks status di layar
        function updateStatus(msg, error = false) {
            statusText.textContent = msg;
            statusText.style.color = error ? "red" : "green";
        }

        // 1. Fungsi untuk mengaktifkan Kamera saat halaman dibuka
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;

                video.onloadedmetadata = async () => {
                    await video.play();
                    updateStatus("Kamera aktif. Pastikan wajah terlihat jelas.");
                };

            } catch (error) {
                console.error(error);
                updateStatus("Gagal mengakses kamera. Izinkan akses kamera di browser Anda.", true);
            }
        }

        // 2. Fungsi Validasi Input Formulir sebelum mengambil foto
        function validateAndVerify() {
            const nama = document.getElementById("nama").value.trim();
            const nik = document.getElementById("nik").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!nama || !nik || !email || !password) {
                updateStatus("Semua data wajib diisi.", true);
                return;
            }

            if (!/^\d{16}$/.test(nik)) {
                updateStatus("NIK harus berupa 16 digit angka.", true);
                return;
            }

            let allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];

            // Cek apakah email sudah pernah terdaftar
            const existingUser = allUsers.find(u => u.email === email);
            if (existingUser) {
                updateStatus("Email sudah terdaftar. Silakan login atau gunakan email lain.", true);
                return;
            }

            // Jika semua validasi aman, jalankan fungsi jepret wajah
            captureFace();
        }

        // 3. Fungsi Menangkap Wajah dan Menyimpan Data Akun
        function captureFace() {
            if (!stream || video.readyState < 2) {
                updateStatus("Kamera belum siap.", true);
                return;
            }

            const nama = document.getElementById("nama").value.trim();
            const nik = document.getElementById("nik").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            const context = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const faceImage = canvas.toDataURL("image/png");

            let allUsers = JSON.parse(localStorage.getItem("allUsers")) || [];

            const newUser = {
                id: Date.now(),
                nama,
                nik,
                email,
                password,
                faceImage
            };

            allUsers.push(newUser);
            localStorage.setItem("allUsers", JSON.stringify(allUsers));
            localStorage.setItem("currentUser", JSON.stringify(newUser));

            // Sesi data penting untuk dibaca halaman pinjamanuser.html
            localStorage.setItem("faceVerified", "true");
            localStorage.setItem("userNama", nama);
            localStorage.setItem("userNik", nik);

            updateStatus("Registrasi berhasil! Mengalihkan...");
            stopCamera();

            setTimeout(() => {
                window.location.href = "pinjamanuser.html";
            }, 1500);
        }

        // 4. Fungsi mematikan kamera demi privasi/keamanan data
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
        }

        // Trigger otomatis untuk menjalankan kamera saat halaman dimuat
        window.addEventListener("DOMContentLoaded", startCamera);
        window.addEventListener("beforeunload", stopCamera);
    </script>

</body>

</html>
