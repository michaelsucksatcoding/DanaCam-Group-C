    <!-- SCRIPT STATUS -->
    <script>
    // Mengambil data pinjaman dari Backend (Flask)
async function fetchLoanStatus() {
    // Simulasi: ID user yang sedang login (nanti diganti dengan data dari sesi/token)
    const userId = 1; 
    
    try {
        // Memanggil API endpoint GET /api/loans?user_id=1
        const response = await fetch(`http://127.0.0.1:5000/api/loans?user_id=${userId}`);
        
        // Cek jika response dari server bermasalah
        if (!response.ok) {
            throw new Error("Gagal mengambil data dari server");
        }

        const data = await response.json();

        // Cek apakah user memiliki pinjaman
        if (data.loans && data.loans.length > 0) {
            // Mengambil pinjaman terbaru (data pertama dari array)
            const borrower = data.loans[0]; 

            // Kalkulasi sesuai logikamu sebelumnya
            const jumlah = borrower.amount;
            const durasi = borrower.term_months;
            const status = borrower.status;
            
            const bungaPersen = 8;
            const bunga = jumlah * (bungaPersen / 100);
            const total = jumlah + bunga;

            // Format rupiah
            const rupiah = (angka) => "Rp " + angka.toLocaleString("id-ID");

            // Update DOM / Tampilan HTML
            document.getElementById("statusPinjaman").textContent = "Status: " + status;
            document.getElementById("jumlahPinjaman").textContent = "Jumlah Pinjaman: " + rupiah(jumlah);
            document.getElementById("bungaPinjaman").textContent = "Bunga: " + bungaPersen + "% (" + rupiah(bunga) + ")";
            document.getElementById("totalPembayaran").textContent = "Total Pembayaran: " + rupiah(total);
            document.getElementById("durasiPinjaman").textContent = "Durasi Pinjaman: " + durasi + " Bulan";
            
            // Catatan: Pastikan kamu menambahkan element untuk nama jika diperlukan, 
            // karena di model Loan tidak ada kolom 'nama', nama diambil dari relasi User.
        } else {
            document.getElementById("statusPinjaman").textContent = "Belum ada pinjaman diajukan.";
        }
    } catch (error) {
        console.error("Error:", error);
        document.getElementById("statusPinjaman").textContent = "Terjadi kesalahan saat memuat data.";
    }
}

// Panggil fungsi saat halaman selesai dimuat
document.addEventListener("DOMContentLoaded", fetchLoanStatus);
</script>
