<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajukan Pinjaman - DanaCam</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="contact loan-page" id="pinjamanuser">
        <h1 class="heading"><span>Ajukan</span> Pinjaman</h1>

        <div class="row">
            <form id="loanForm" onsubmit="submitLoan(event)">
                <h2>Form Pengajuan Dana</h2>

                <input type="text" id="loanNama" class="box" readonly>

                <input type="number" id="jumlah" placeholder="Jumlah Pinjaman (Maks. 10.000.000)" class="box"
                    min="100000" max="10000000" required>

                <input type="number" id="durasi" placeholder="Durasi Pinjaman (1-60 bulan)" class="box" min="1" max="60"
                    required>

                <input type="number" id="penghasilan" placeholder="Penghasilan Bulanan" class="box" min="500000"
                    required>

                <textarea id="tujuan" class="box" placeholder="Tujuan Pinjaman" cols="30" rows="10" required></textarea>

                <button type="submit" class="btn">Ajukan Sekarang</button>

                <p id="loanStatus">
                    Catatan: Persetujuan bergantung pada kelengkapan data, verifikasi wajah, dan riwayat finansial.
                </p>
            </form>
        </div>
    </section>

    <section class="footer">
        <!-- Footer kamu -->
    </section>

    <script>
        if (localStorage.getItem("faceVerified") !== "true") {
            alert("Silakan verifikasi wajah terlebih dahulu!");
            window.location.href = "register.html";
        }

        // Mengisi nama otomatis (Sekarang Berhasil karena kunci 'userNama' sudah ada)
        document.getElementById("loanNama").value = localStorage.getItem("userNama") || "";

        // Submit pinjaman
        function submitLoan(event) {
            // 1. Mencegah halaman melakukan reload otomatis
            event.preventDefault();

            // 2. Ambil data pengenal user yang sedang login dari localStorage
            // Jika kosong, ambil dari data register terakhir sebagai cadangan
            const currentUser = JSON.parse(localStorage.getItem("currentUser")) || {};
            const nama = localStorage.getItem("userNama") || currentUser.nama || "Pengguna Tanpa Nama";
            const nik = localStorage.getItem("userNik") || currentUser.nik || "0000000000000000";

            // 3. Ambil data dari elemen input form
            const jumlahInput = document.getElementById("jumlah").value;
            const durasiInput = document.getElementById("durasi").value;
            const tujuan = document.getElementById("tujuan").value.trim();

            // 4. Konversi teks input menjadi angka murni
            const jumlah = parseInt(jumlahInput, 10);
            const durasi = parseInt(durasiInput, 10);

            // 5. Validasi dasar untuk mencegah data kosong/rusak masuk ke admin
            if (isNaN(jumlah) || isNaN(durasi) || !tujuan) {
                alert("Mohon isi jumlah dana, tenor, dan tujuan pinjaman dengan benar!");
                return;
            }

            // 6. Ambil semua daftar pinjaman yang sudah ada di memori browser
            let allBorrowers = JSON.parse(localStorage.getItem("allBorrowers")) || [];

            // 7. Buat ID unik transaksi berbasis waktu (Milidetik saat ini)
            const borrowerId = Date.now();

            // 8. Set status awal menjadi 'Pending' agar bisa di-Aksi oleh Admin
            const statusPinjaman = "Pending";

            // 9. Bundel semua data ke dalam objek struktur baru yang rapi
            const newBorrower = {
                id: borrowerId,
                nama: nama,
                nik: nik,
                jumlah: jumlah,
                durasi: durasi,
                tujuan: tujuan,
                tanggal: new Date().toLocaleDateString('id-ID'),
                status: statusPinjaman
            };

            // 10. Masukkan ke dalam array database lokal dan simpan kembali
            allBorrowers.push(newBorrower);
            localStorage.setItem("allBorrowers", JSON.stringify(allBorrowers));

            // 11. Ikat ID pinjaman ini sebagai rujukan aktif untuk halaman status.html
            localStorage.setItem("currentBorrowerId", borrowerId);

            // 12. Notifikasi sukses dan alihkan halaman
            alert("Pengajuan Anda berhasil dikirim! Silakan cek status berkala.");
            window.location.href = "status.html";
        }

    </script>

</body>

</html>
