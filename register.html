<!DOCTYPE html>

<head>

    <!-- header -->

    <!-- register -->
    <section class="contact" id="register">

        <h1 class="heading"><span> Verifikasi </span> Data Diri</h1>

        <div class="row">

            <form action="">

                <input type="text" placeholder="Nama Lengkap" class="box">

                <input type="email" placeholder="Email" class="box">

                <!-- VERIFIKASI WAJAH -->
                <h3>Verifikasi Wajah</h3>

                <video id="video" width="300" height="250" autoplay></video>

                <canvas id="canvas" style="display:none;"></canvas>

                <button type="button" class="btn" onclick="captureFace()">Verifikasi Wajah</button>

                <a href="pinjamanuser.html" class="btn">Lanjut Ajukan Pinjaman</a>

                <p id="status"></p>

            </form>

        </div>

    </section>

        ...
    </section>

    <script src="faceverification.js"></script>
